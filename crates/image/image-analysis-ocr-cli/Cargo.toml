[package]
name = "moenarch-image-analysis-ocr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line adapter for the image-analysis-ocr library crate."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
default-run = "image-analysis-ocr-cli"

[lib]
name = "image_analysis_ocr_cli"

[[bin]]
name = "image-analysis-ocr-cli"
path = "src/main.rs"

[dependencies]
runtime-core.workspace = true
clap.workspace = true
serde_json.workspace = true
image-analysis-ocr = { package = "moenarch-image-analysis-ocr", version = "0.1.0", path = "../image-analysis-ocr", features = ["local-onnx"] }

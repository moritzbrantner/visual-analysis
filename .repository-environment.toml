schema_version = 1

[policy]
track = "latest-stable"

[system]
apt = []

[setup]
commands = ["bun install --frozen-lockfile", "cargo fetch --locked"]

[maintenance]
commands = ["bun install --frozen-lockfile", "cargo fetch --locked"]

[cache]
paths = ["~/.cargo", "~/.bun/install/cache"]

[compatibility_holds]

name: Fresh-clone bootstrap

# #66: a clean checkout with no prepared sibling repositories must fetch only
# the declared, revision-pinned source inputs, activate them with the existing
# source-deps tooling, and then build and test the workspace. Invalid or
# moving pins must fail visibly.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fresh-clone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: clean/visual-analysis
    steps:
      - name: Check out repository into an otherwise empty directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: clean/visual-analysis
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Require no prepared siblings
        run: |
          set -euo pipefail
          siblings="$(find .. -mindepth 1 -maxdepth 1 ! -name visual-analysis -printf '%f\n')"
          if [[ -n "$siblings" ]]; then
            printf 'unexpected entries next to the clean checkout:\n%s\n' "$siblings" >&2
            exit 1
          fi

      - name: Invalid pins fail visibly
        run: bash scripts/test_bootstrap_source_deps.sh

      - name: Bootstrap declared source inputs
        run: bash scripts/bootstrap-source-deps.sh

      - name: Verify source provenance
        run: |
          set -euo pipefail
          test "$(git -C ../coding-tooling rev-parse HEAD)" = "$(tr -d '[:space:]' < scripts/coding-tooling.rev)"
          python3 - <<'PY'
          import json, subprocess
          patches = json.load(open('.coding-tooling.source-deps.json'))['cargo']['patches']
          head = subprocess.check_output(['git', '-C', '../moenarch-foundation', 'rev-parse', 'HEAD'], text=True).strip()
          assert {p['rev'] for p in patches} == {head}, (head, {p['rev'] for p in patches})
          print(f'moenarch-foundation at pinned {head}')
          PY
          siblings="$(find .. -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')"
          test "$siblings" = "coding-tooling moenarch-foundation visual-analysis " \
            || { printf 'undeclared sibling inputs: %s\n' "$siblings" >&2; exit 1; }

      - name: Build and test the workspace
        run: cargo test --locked --workspace

      - name: The build changed no tracked or untracked inputs
        run: |
          set -euo pipefail
          bash scripts/source-deps deactivate
          dirty="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$dirty" ]]; then
            printf 'the fresh-clone build modified the checkout:\n%s\n' "$dirty" >&2
            exit 1
          fi

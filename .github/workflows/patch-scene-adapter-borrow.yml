name: Temporary scene adapter borrow repair

on:
  push:
    branches: [codex/usable-vision-stack]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/usable-vision-stack

      - name: Repair scene adapter borrow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/video/video-analysis-core/src/lib.rs")
          text = path.read_text()
          old = '''        Ok(detected
            .scene_list
            .scenes
            .into_iter()
            .map(|scene| scene.start.0)
            .filter(|start| *start != 0 && self.emitted.insert(*start))
            .map(|frame_index| Cut {
                position: position_like(frame.position, frame_index),
                detector: self.name(),
                score: None,
            })
            .collect())
'''
          new = '''        let detector = self.name();
        Ok(detected
            .scene_list
            .scenes
            .into_iter()
            .map(|scene| scene.start.0)
            .filter(|start| *start != 0 && self.emitted.insert(*start))
            .map(|frame_index| Cut {
                position: position_like(frame.position, frame_index),
                detector,
                score: None,
            })
            .collect())
'''
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit("scene adapter borrow block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit repair when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/video/video-analysis-core/src/lib.rs
          git commit -m "Fix scene adapter borrow"
          git push origin HEAD:codex/usable-vision-stack

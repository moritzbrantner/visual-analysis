name: Temporary scene adapter borrow repair

on:
  push:
    branches: [codex/usable-vision-stack]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/usable-vision-stack

      - name: Repair scene adapter borrow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/video/video-analysis-core/src/lib.rs")
          text = path.read_text()
          marker = "        Ok(detected\n            .scene_list"
          replacement = "        let detector = self.name();\n        Ok(detected\n            .scene_list"
          if replacement not in text:
              if marker not in text:
                  raise SystemExit("scene adapter result block not found")
              text = text.replace(marker, replacement, 1)
          old_name = "                detector: self.name(),"
          if old_name in text:
              text = text.replace(old_name, "                detector,", 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Commit repair when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/video/video-analysis-core/src/lib.rs
          git commit -m "Fix scene adapter borrow"
          git push origin HEAD:codex/usable-vision-stack

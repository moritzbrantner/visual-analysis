name: Pages acceptance

# Required check for issue #67. Deliberately not path-filtered and without
# job-level conditions so the `Pages acceptance` check always reports on every
# pull request head. The artifact is built exactly as pages.yml builds it today
# (pinned coding-tooling + declared foundation source revision); building from
# the repository alone / registry-only is deferred to issue #69.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CODING_TOOLING_REV: 7f63dade760bfb1020c69d1a0ac7319cbbdf91ab

concurrency:
  group: pages-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages-acceptance:
    name: Pages acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun for source-dependency tooling
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Prepare pinned source workspaces
        shell: bash
        run: |
          set -euo pipefail
          git init ../coding-tooling
          git -C ../coding-tooling fetch --depth=1 https://github.com/moritzbrantner/coding-tooling.git "$CODING_TOOLING_REV"
          git -C ../coding-tooling checkout --detach FETCH_HEAD
          (cd ../coding-tooling && bun install --frozen-lockfile)

          FOUNDATION_REV="$(python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('.coding-tooling.source-deps.json').read_text())
          revisions = {
              patch['rev']
              for patch in manifest['cargo']['patches']
              if patch['git'] == 'https://github.com/moritzbrantner/moenarch-foundation'
          }
          if len(revisions) != 1:
              raise SystemExit(f'expected one Foundation revision, found {sorted(revisions)}')
          print(revisions.pop())
          PY
          )"
          git init ../moenarch-foundation
          git -C ../moenarch-foundation fetch --depth=1 https://github.com/moritzbrantner/moenarch-foundation.git "$FOUNDATION_REV"
          git -C ../moenarch-foundation checkout --detach FETCH_HEAD
      - name: Activate pinned source dependencies
        run: bash scripts/source-deps activate
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install pinned browser test runner
        run: |
          python -m pip install --disable-pip-version-check -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Pages node tests and workflow contract
        run: node --test tests/pages/*.test.mjs tests/pages-acceptance/*.test.mjs
      - name: Fixture integrity
        run: python tests/fixtures/pages/generate.py --check
      - name: Build and verify the Pages artifact
        run: bash scripts/check-pages.sh _site
      - name: Browser acceptance (hermetic, one worker)
        env:
          PAGES_ARTIFACT_DIR: _site
        run: python tests/browser/pages_workbench.py
      - name: Deactivate pinned source dependencies
        if: always()
        run: bash scripts/source-deps deactivate || true

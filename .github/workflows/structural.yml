name: Structural extraction

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: git diff --check c5d6b02a708837cf01ee6e033faa41b0a667b38b..HEAD
      - run: python3 scripts/check_visual_extraction.py --check
      - name: Capability boundary
        run: python3 scripts/test_check_visual_boundary.py && python3 scripts/check-visual-boundary.py

      - name: Bootstrap declared source inputs
        run: bash scripts/bootstrap-source-deps.sh

      - name: Verify locked workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Deactivate pinned source dependencies
        if: always()
        run: bash scripts/source-deps deactivate || true

name: Audit offline Rust workspace
on:
  push:
    branches: [audit/validation-workspace]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODING_TOOLING_REV: 7f63dade760bfb1020c69d1a0ac7319cbbdf91ab
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Prepare declared source graph
        shell: bash
        run: |
          set -euo pipefail
          git init ../coding-tooling
          git -C ../coding-tooling fetch --depth=1 https://github.com/moritzbrantner/coding-tooling.git "$CODING_TOOLING_REV"
          git -C ../coding-tooling checkout --detach FETCH_HEAD
          (cd ../coding-tooling && bun install --frozen-lockfile)
          FOUNDATION_REV="$(python3 -c 'import json; p=json.load(open(".coding-tooling.source-deps.json"))["cargo"]["patches"]; r={x["rev"] for x in p}; assert len(r)==1; print(r.pop())')"
          git init ../moenarch-foundation
          git -C ../moenarch-foundation fetch --depth=1 https://github.com/moritzbrantner/moenarch-foundation.git "$FOUNDATION_REV"
          git -C ../moenarch-foundation checkout --detach FETCH_HEAD
          bash scripts/source-deps activate
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-visual-audit-native-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-visual-native-onnx-cargo-
      - name: Fetch exact locked dependencies and toolchain
        run: cargo fetch --locked
      - name: Export public sources and compiler, never credentials or build outputs
        shell: bash
        run: |
          set -euo pipefail
          tar --zstd -cf audit-rust-runtime.tar.zst -C "$HOME" \
            .rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu/bin \
            .rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu/lib \
            .rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu/libexec \
            .cargo/registry
          tar --zstd -cf audit-foundation.tar.zst -C .. moenarch-foundation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-analysis-offline-rust
          path: |
            audit-rust-runtime.tar.zst
            audit-foundation.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

name: Audit native baseline
on:
  push:
    branches: [audit/validation-workspace]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      CODING_TOOLING_REV: 7f63dade760bfb1020c69d1a0ac7319cbbdf91ab
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Prepare declared source graph
        shell: bash
        run: |
          set -euo pipefail
          git init ../coding-tooling
          git -C ../coding-tooling fetch --depth=1 https://github.com/moritzbrantner/coding-tooling.git "$CODING_TOOLING_REV"
          git -C ../coding-tooling checkout --detach FETCH_HEAD
          (cd ../coding-tooling && bun install --frozen-lockfile)
          FOUNDATION_REV="$(python3 -c 'import json; p=json.load(open(".coding-tooling.source-deps.json"))["cargo"]["patches"]; r={x["rev"] for x in p}; assert len(r)==1; print(r.pop())')"
          git init ../moenarch-foundation
          git -C ../moenarch-foundation fetch --depth=1 https://github.com/moritzbrantner/moenarch-foundation.git "$FOUNDATION_REV"
          git -C ../moenarch-foundation checkout --detach FETCH_HEAD
          bash scripts/source-deps activate
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-visual-audit-native-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-visual-native-onnx-cargo-
      - name: Native library and integration baseline
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p moenarch-video-analysis-core -p moenarch-video-analysis-ffmpeg -p moenarch-video-analysis-detectors -p moenarch-video-analysis-ingest -p moenarch-video-analysis-recognition --features moenarch-video-analysis-recognition/ocr --lib --tests 2>&1 | tee native-baseline.log
      - name: Retain exact dependency source for offline review
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          with tarfile.open('audit-dependency-source.tar.gz', 'w:gz') as archive:
              for pattern in ('scenedetect-core-*', 'moenarch-text-core-*'):
                  for path in (Path.home()/'.cargo/registry/src').glob('*/'+pattern):
                      archive.add(path, arcname=path.name)
              foundation = Path('../moenarch-foundation')
              if foundation.exists():
                  archive.add(foundation, arcname='moenarch-foundation', filter=lambda entry: None if '/.git/' in entry.name or entry.name.endswith('/.git') else entry)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-analysis-native-baseline
          path: |
            native-baseline.log
            audit-dependency-source.tar.gz
          retention-days: 1
          if-no-files-found: error

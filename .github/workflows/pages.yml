name: GitHub Pages

on:
  pull_request:
    paths:
      - "site/**"
      - "tests/pages/**"
      - "scripts/build-pages.sh"
      - "scripts/check-pages.sh"
      - "scripts/check-pages-artifact.mjs"
      - "scripts/check-pages-clean-checkout.sh"
      - "scripts/check-pages-provenance.mjs"
      - "crates/image/image-analysis-core/**"
      - "crates/image/image-analysis-processing/**"
      - "crates/bindings/image-analysis-core-wasm/**"
      - "crates/bindings/image-analysis-processing-wasm/**"
      - "packages/image-analysis-core-wasm/**"
      - "packages/image-analysis-processing-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".coding-tooling.source-deps.json"
      - "scripts/bootstrap-source-deps.sh"
      - "scripts/coding-tooling.rev"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/pages/**"
      - "scripts/build-pages.sh"
      - "scripts/check-pages.sh"
      - "scripts/check-pages-artifact.mjs"
      - "scripts/check-pages-clean-checkout.sh"
      - "scripts/check-pages-provenance.mjs"
      - "crates/image/image-analysis-core/**"
      - "crates/image/image-analysis-processing/**"
      - "crates/bindings/image-analysis-core-wasm/**"
      - "crates/bindings/image-analysis-processing-wasm/**"
      - "packages/image-analysis-core-wasm/**"
      - "packages/image-analysis-processing-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".coding-tooling.source-deps.json"
      - "scripts/bootstrap-source-deps.sh"
      - "scripts/coding-tooling.rev"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun for source-dependency tooling
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0
      # #69: the deployed artifact is built from a clean clone of this commit
      # that fetches only the declared source pins (scripts/bootstrap-source-deps.sh).
      - name: Build Visual Inspector from a clean checkout
        run: bash scripts/check-pages-clean-checkout.sh _site
      - name: Verify artifact provenance against this commit
        run: |
          set -euo pipefail
          node scripts/check-pages-provenance.mjs _site .
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "### Pages artifact provenance"
            echo '```json'
            cat _site/build-provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

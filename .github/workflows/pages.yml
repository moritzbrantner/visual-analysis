name: GitHub Pages

on:
  pull_request:
    paths:
      - "site/**"
      - "tests/pages/**"
      - "scripts/build-pages.sh"
      - "scripts/check-pages.sh"
      - "scripts/check-pages-artifact.mjs"
      - "crates/image/image-analysis-core/**"
      - "crates/image/image-analysis-processing/**"
      - "crates/bindings/image-analysis-core-wasm/**"
      - "crates/bindings/image-analysis-processing-wasm/**"
      - "packages/image-analysis-core-wasm/**"
      - "packages/image-analysis-processing-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/pages/**"
      - "scripts/build-pages.sh"
      - "scripts/check-pages.sh"
      - "scripts/check-pages-artifact.mjs"
      - "crates/image/image-analysis-core/**"
      - "crates/image/image-analysis-processing/**"
      - "crates/bindings/image-analysis-core-wasm/**"
      - "crates/bindings/image-analysis-processing-wasm/**"
      - "packages/image-analysis-core-wasm/**"
      - "packages/image-analysis-processing-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CODING_TOOLING_REV: 7f63dade760bfb1020c69d1a0ac7319cbbdf91ab

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Bun for source-dependency tooling
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Prepare pinned source workspaces
        shell: bash
        run: |
          set -euo pipefail
          git init ../coding-tooling
          git -C ../coding-tooling fetch --depth=1 https://github.com/moritzbrantner/coding-tooling.git "$CODING_TOOLING_REV"
          git -C ../coding-tooling checkout --detach FETCH_HEAD
          (cd ../coding-tooling && bun install --frozen-lockfile)

          FOUNDATION_REV="$(python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('.coding-tooling.source-deps.json').read_text())
          revisions = {
              patch['rev']
              for patch in manifest['cargo']['patches']
              if patch['git'] == 'https://github.com/moritzbrantner/moenarch-foundation'
          }
          if len(revisions) != 1:
              raise SystemExit(f'expected one Foundation revision, found {sorted(revisions)}')
          print(revisions.pop())
          PY
          )"
          git init ../moenarch-foundation
          git -C ../moenarch-foundation fetch --depth=1 https://github.com/moritzbrantner/moenarch-foundation.git "$FOUNDATION_REV"
          git -C ../moenarch-foundation checkout --detach FETCH_HEAD
      - name: Activate pinned source dependencies
        run: bash scripts/source-deps activate
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0
      - name: Verify Visual Inspector artifact
        run: bash scripts/check-pages.sh
      - name: Deactivate pinned source dependencies
        if: always()
        run: bash scripts/source-deps deactivate || true
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

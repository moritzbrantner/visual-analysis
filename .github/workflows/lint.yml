name: Deterministic lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          components: clippy

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Bootstrap declared source inputs
        run: bash scripts/bootstrap-source-deps.sh

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Deactivate source dependencies
        if: always()
        run: bash scripts/source-deps deactivate

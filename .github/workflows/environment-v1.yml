name: Environment v1

on:
  pull_request:
    paths:
      - ".repository-environment.toml"
      - ".coding-tooling.source-deps.json"
      - "scripts/codex-environment.sh"
      - "package.json"
      - "bun.lock"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/environment-v1.yml"
  push:
    branches: [main]
    paths:
      - ".repository-environment.toml"
      - ".coding-tooling.source-deps.json"
      - "scripts/codex-environment.sh"
      - "package.json"
      - "bun.lock"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/environment-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup

      - name: Verify exact toolchains
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.3.14"
          test "$(rustc --version | awk '{print $2}')" = "1.95.0"

      - name: Verify source mode remains explicit
        run: test ! -e .cargo/config.toml

      - name: Verify structural baseline
        run: |
          python3 scripts/check_visual_extraction.py --check
          cargo metadata --format-version 1 --no-deps > /dev/null

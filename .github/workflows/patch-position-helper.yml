name: Temporary extraction helper repair

on:
  push:
    branches: [codex/usable-vision-stack]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/usable-vision-stack

      - name: Restore position helper removed by bootstrap transform
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/video/video-analysis-core/src/lib.rs")
          text = path.read_text()
          if "fn position_like(current: FramePosition, frame_index: u64)" in text:
              raise SystemExit(0)
          marker = "\n/// Trait for video source implementations.\n"
          helper = '''
          fn position_like(current: FramePosition, frame_index: u64) -> FramePosition {
              let delta = frame_index as i64 - current.frame_index as i64;
              FramePosition {
                  frame_index,
                  timestamp: Timestamp::new(current.timestamp.pts + delta, current.timestamp.timebase),
              }
          }
          '''
          if marker not in text:
              raise SystemExit("video-analysis-core insertion marker not found")
          path.write_text(text.replace(marker, "\n" + helper + marker, 1))
          PY
          git diff --check

      - name: Commit repair when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/video/video-analysis-core/src/lib.rs
          git commit -m "Restore scene adapter position helper"
          git push origin HEAD:codex/usable-vision-stack

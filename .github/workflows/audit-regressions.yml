name: Audit regression fences

on:
  pull_request:
    paths:
      - "crates/video/**"
      - "site/**"
      - "tests/pages/**"
      - "tests/browser/**"
      - "scripts/*audit*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".coding-tooling.source-deps.json"
      - ".github/workflows/audit-regressions.yml"
  push:
    branches: [main]
    paths:
      - "crates/video/**"
      - "site/**"
      - "tests/pages/**"
      - "tests/browser/**"
      - "scripts/*audit*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".coding-tooling.source-deps.json"
      - ".github/workflows/audit-regressions.yml"
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Run measured release benchmarks (never a timing threshold)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CODING_TOOLING_REV: 7f63dade760bfb1020c69d1a0ac7319cbbdf91ab

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install fixture decoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Prepare pinned source workspaces
        shell: bash
        run: |
          set -euo pipefail
          git init ../coding-tooling
          git -C ../coding-tooling fetch --depth=1 https://github.com/moritzbrantner/coding-tooling.git "$CODING_TOOLING_REV"
          git -C ../coding-tooling checkout --detach FETCH_HEAD
          (cd ../coding-tooling && bun install --frozen-lockfile)

          FOUNDATION_REV="$(python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('.coding-tooling.source-deps.json').read_text())
          revisions = {
              patch['rev']
              for patch in manifest['cargo']['patches']
              if patch['git'] == 'https://github.com/moritzbrantner/moenarch-foundation'
          }
          if len(revisions) != 1:
              raise SystemExit(f'expected one Foundation revision, found {sorted(revisions)}')
          print(revisions.pop())
          PY
          )"
          git init ../moenarch-foundation
          git -C ../moenarch-foundation fetch --depth=1 https://github.com/moritzbrantner/moenarch-foundation.git "$FOUNDATION_REV"
          git -C ../moenarch-foundation checkout --detach FETCH_HEAD

      - name: Activate pinned source dependencies
        run: bash scripts/source-deps activate

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-visual-audit-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.coding-tooling.source-deps.json') }}
          restore-keys: |
            ${{ runner.os }}-visual-audit-
            ${{ runner.os }}-visual-native-onnx-cargo-
      - name: Native correctness, allocation bounds, Clippy, and benchmark executability
        run: bash scripts/check-audit-regressions.sh
      - name: Measure scene and text workloads
        if: github.event_name == 'push' || inputs.benchmarks == true
        shell: bash
        run: |
          set -euo pipefail
          cargo bench --locked -p moenarch-video-analysis-detectors --bench scene_detectors -- --noplot 2>&1 | tee .artifacts/audit/scene-bench.log
          cargo bench --locked -p moenarch-video-analysis-recognition --features ocr --bench text_regressions -- --noplot 2>&1 | tee .artifacts/audit/text-bench.log
          python3 scripts/report-audit-benchmarks.py
      - name: Restore registry mode
        if: always()
        run: bash scripts/source-deps deactivate
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-native-${{ github.sha }}
          path: .artifacts/audit/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned browser test runner
        run: |
          python -m pip install --disable-pip-version-check -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Pure browser adapter contracts
        run: node --test tests/pages/*.test.mjs
      - name: Real Chromium request races (deferred model fixtures, zero network)
        run: |
          mkdir -p .artifacts/browser
          set -o pipefail
          python tests/browser/vision_races.py 2>&1 | tee .artifacts/browser/races.log
      - name: Retain screenshot and browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-browser-${{ github.sha }}
          path: .artifacts/browser/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
